<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Camera Sync</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<div class="shell">
		<div class="telemetry">
			<span class="brand">
				<span class="brand__mark" aria-hidden="true">S<span class="brand__lens"></span>NY</span>
				<span class="brand__sub">Imagine Edge Docker</span>
			</span>
			<span class="telemetry__spacer"></span>
			<span class="telemetry__item" id="tm-iface">IF …</span>
			<span class="telemetry__item" id="tm-camera">CAM …</span>
			<span class="telemetry__item" id="tm-ssid">SSID …</span>
			<a class="telemetry__signout" href="/logout">Sign out</a>
		</div>

		<section class="viewfinder" aria-label="Pairing status">
			<div class="stage">
				<div class="af-frame" id="af-frame" data-state="idle">
					<span class="af-frame__corner af-frame__corner--tl" aria-hidden="true"></span>
					<span class="af-frame__corner af-frame__corner--tr" aria-hidden="true"></span>
					<span class="af-frame__corner af-frame__corner--bl" aria-hidden="true"></span>
					<span class="af-frame__corner af-frame__corner--br" aria-hidden="true"></span>

					<div class="readout">
						<span class="readout__state" id="status-word">IDLE</span>
						<span class="readout__rec" aria-hidden="true"></span>
					</div>
					<p class="readout__phase" id="phase-line" aria-live="polite">Ready. Put the camera in “Send to Smartphone” mode, then press Pair.</p>
				</div>

				<button class="shutter" id="pair-btn" type="button" aria-describedby="phase-line">
					<span class="shutter__ring" aria-hidden="true"></span>
					<span class="shutter__label">PAIR</span>
				</button>
			</div>

			<div class="exposure-row">
				<div class="exposure">
					<span class="exposure__label">DOWNLOADED</span>
					<span class="exposure__value" id="count-downloaded">0</span>
				</div>
				<div class="exposure">
					<span class="exposure__label">SKIPPED</span>
					<span class="exposure__value" id="count-skipped">0</span>
				</div>
				<div class="exposure">
					<span class="exposure__label">SEEN</span>
					<span class="exposure__value" id="count-seen">0</span>
				</div>
			</div>

			<p class="current-file" id="current-file"></p>

			<ul class="log" id="log" aria-label="Event log" aria-live="polite"></ul>
		</section>

		<section class="frames" aria-label="Recent frames">
			<div class="frames__head">
				<h2>Recent frames</h2>
				<span class="frames__count" id="frames-count"></span>
			</div>
			<div class="frames__grid" id="photo-grid"></div>
			<div class="frames__pager" id="frames-pager" hidden>
				<button class="frames__pagebtn" id="page-prev" type="button">&#x2039; Prev</button>
				<span class="frames__pageinfo" id="page-info" aria-live="polite"></span>
				<button class="frames__pagebtn" id="page-next" type="button">Next &#x203A;</button>
			</div>
			<p class="frames__empty" id="frames-empty" hidden>No frames yet. Sync to pull images from the camera.</p>
		</section>
	</div>

	<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Media viewer">
		<button class="lightbox__close" id="lightbox-close" type="button" aria-label="Close viewer">&#x2715;</button>
		<button class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" type="button" aria-label="Previous">&#x2039;</button>
		<button class="lightbox__nav lightbox__nav--next" id="lightbox-next" type="button" aria-label="Next">&#x203A;</button>
		<div class="lightbox__stage" id="lightbox-stage"></div>
		<div class="lightbox__bar">
			<span class="lightbox__name" id="lightbox-name"></span>
			<a class="lightbox__download" id="lightbox-download" href="#" download>Download original</a>
		</div>
	</div>

	<script src="/app.js"></script>
</body>
</html>
